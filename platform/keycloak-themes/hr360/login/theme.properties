# HR360 giris temasi.
#
# keycloak.v2'yi genisletiyoruz: FreeMarker sablonlarini override ETMIYORUZ,
# yalnizca CSS bindiriyoruz. Boylece Keycloak surum yukseltmelerinde sablon
# degisse bile tema kirilmaz.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/hr360.css

# Varsayilan dil Turkce; kullanici degistirebilir.
locales=tr,en
defaultLocale=tr
