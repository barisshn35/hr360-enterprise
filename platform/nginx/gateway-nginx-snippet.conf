# nginx.conf 'http' blogu icine, mevcut upstream'lerin yanina:
    upstream recruitment_backend {
        server 172.33.55.2:5005;
    }
    upstream onboarding_backend {
        server 172.33.55.2:5006;
    }
    upstream leave_backend {
        server 172.33.55.2:5004;
    }
    upstream timeshift_backend {
        server 172.33.55.3:5007;
    }
    upstream performance_backend {
        server 172.33.55.3:5008;
    }
    upstream learning_backend {
        server 172.33.55.3:5009;
    }
    upstream compensation_backend {
        server 172.33.55.2:5010;
    }
    upstream expense_backend {
        server 172.33.55.2:5011;
    }
    upstream notification_backend {
        server 172.33.55.3:5012;
    }

# nginx.conf 'server' blogu icine, 'location /' BLOGUNDAN ONCE:

        location /api/recruitment/ {
            rewrite ^/api/recruitment/(.*) /api/$1 break;
            proxy_pass http://recruitment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

