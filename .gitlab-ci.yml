test:web:
  stage: test
  image: node:20-slim
  tags: [hr360, ops]
  rules:
    - changes: [apps/web/**/*]
  script:
    - cd apps/web
    - npm install
    - npm run build

build:web:
  extends: .kaniko_build_template
  variables:
    SERVICE_DIR: apps/web
    SERVICE_NAME: web
  rules:
    - changes: [apps/web/**/*]

