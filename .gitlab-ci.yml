# ============================================================
# DEPLOY - ortak sablon + her servis icin ayri job
# ============================================================

.deploy_template:
  stage: deploy
  image: python:3.12-slim
  tags: [hr360, ops]
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client sshpass >/dev/null
    - pip install --quiet ansible
    - ansible-galaxy collection install -r platform/ansible/requirements.yml
    # SSH_DEPLOY_KEY (File type, cok satirli) yapistirma sirasinda bir
    # satir kaybetmisti ("error in libcrypto"). SSH_DEPLOY_KEY_B64 (tek
    # satir, base64) bu riski ortadan kaldirir - kendi tarafimda uretilen
    # anahtardan birebir kodlanmis, decode edip dogrulayarak kullaniyoruz.
    - echo "$SSH_DEPLOY_KEY_B64" | base64 -d > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - echo "Anahtar dogrulama (public key uretimi):" && ssh-keygen -y -f /tmp/deploy_key
  script:
    - cd platform/ansible
    - >
      ansible-playbook -i inventory.yml deploy-service.yml
      -e "service_name=${SERVICE_NAME}"
      -e "target_host=${TARGET_HOST}"
      -e "image_tag=${CI_COMMIT_SHORT_SHA}"
      -e "health_port=${HEALTH_PORT}"

deploy:notification-service:
  extends: .deploy_template
  needs: ["build:notification-service"]
  rules:
    - changes: [apps/services/notification-service/**/*]
  variables:
    SERVICE_NAME: notification-service
    TARGET_HOST: hr360-prd-ml-01
    HEALTH_PORT: "5012"

