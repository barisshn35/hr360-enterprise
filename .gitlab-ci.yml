# HR360 Enterprise - CI/CD Pipeline
#
# Runner kaynak kisiti (bilinçli, plan §9.3): tek runner, "concurrent = 1",
# 1 vCPU / 1.5 GB. Bu yuzden butun servisleri her commit'te yeniden build
# ETMEYIZ - "rules: changes:" ile SADECE degisen servisin job'u calisir.
#
# Asama 1 (bu surum): test + build + registry push.
# Asama 2 (sonraki surum): Ansible ile rolling deploy, health check, rollback.

stages:
  - test
  - build
  - deploy

variables:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# ============================================================
# ORTAK SABLONLAR
# ============================================================

.dotnet_test_template:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags: [hr360, ops]
  script:
    - cd "$SERVICE_DIR"
    - dotnet build --nologo -v q

.kaniko_build_template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags: [hr360, ops]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/${SERVICE_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${SERVICE_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:latest"

# ============================================================
# .NET SERVISLERI - her biri sadece kendi klasoru degistiginde calisir
# ============================================================

test:employee-service:
  extends: .dotnet_test_template
  variables:
    SERVICE_DIR: apps/services/employee-service
  rules:
    - changes: [apps/services/employee-service/**/*]
build:employee-service:
