events {
    worker_connections 1024;
}

http {
    # Tek sunucu kurulumunda tum servisler ayni Docker network'unde,
    # servis adiyla birbirini bulur (Docker'in dahili DNS'i).
    #
    # NOT: Onceden adresler yalnizca nginx acilisinda cozuluyordu. Bir servis
    # konteyneri yeniden baslayip yeni IP aldiginda gateway, kendisi yeniden
    # baslatilana kadar o servise 404/502 donuyordu (dagitim sonrasi kesinti).
    # "resolve" ile Docker DNS'i (127.0.0.11) 10 sn'de bir yeniden sorulur.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream keycloak_backend    { zone keycloak_backend 64k; server keycloak:8080 resolve; }
    upstream ml_inference_backend { zone ml_inference_backend 64k; server ml-inference:8000 resolve; }
    upstream minio_backend       { zone minio_backend 64k; server minio:9000 resolve; }
    upstream organization_backend { zone organization_backend 64k; server organization-service:8080 resolve; }
    upstream employee_backend    { zone employee_backend 64k; server employee-service:8080 resolve; }
    upstream workflow_backend    { zone workflow_backend 64k; server workflow-service:8080 resolve; }
    upstream recruitment_backend { zone recruitment_backend 64k; server recruitment-service:8080 resolve; }
    upstream onboarding_backend  { zone onboarding_backend 64k; server onboarding-service:8080 resolve; }
    upstream learning_backend    { zone learning_backend 64k; server learning-service:8080 resolve; }
    upstream notification_backend { zone notification_backend 64k; server notification-service:8080 resolve; }
    upstream leave_backend       { zone leave_backend 64k; server leave-service:8080 resolve; }
    upstream compensation_backend { zone compensation_backend 64k; server compensation-service:8080 resolve; }
    upstream expense_backend     { zone expense_backend 64k; server expense-service:8080 resolve; }
    upstream timeshift_backend   { zone timeshift_backend 64k; server timeshift-service:8080 resolve; }
    upstream performance_backend { zone performance_backend 64k; server performance-service:8080 resolve; }
    upstream tenant_backend      { zone tenant_backend 64k; server tenant-service:8080 resolve; }
    upstream web_frontend        { zone web_frontend 64k; server web:8080 resolve; }

    server {
        # Logo yuklemesi 2 MB'a kadar izinli; nginx varsayilani (1 MB) gecerli
        # dosyalari 413 HTML sayfasiyla reddediyordu.
        client_max_body_size 3m;
        server_tokens off;
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location /gateway/health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"hr360-gateway"}';
        }

        # Keycloak, --http-relative-path=/auth ile calisiyor; bu yuzden
        # yol degistirmeden (rewrite yapmadan) birebir yonlendiriyoruz.
        # Keycloak yonetim konsolu + master realm (yonetici girisi ve yonetim API'si).
        # Erisim kurali scripts/keycloak-admin-access.sh ile uretilen dosyadan gelir:
        # dosya yoksa (varsayilan) acik; "ip" modunda yalnizca izinli IP'ler; "port"
        # modunda burada tamamen kapali (panel ayri porttan, bkz. alttaki server).
        # Bkz. docs/runbooks/keycloak-yonetim-paneli-erisimi.md
        location ~ ^/auth/(admin|realms/master)(/|$) {
            include /etc/nginx/keycloak-admin/main-*.conf;
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /auth/ {
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Istemcinin gonderdigi X-Forwarded-Host olduğu gibi Keycloak'a
            # iletiliyordu; ezilir (Keycloak'in genel adresi zaten sabit).
            proxy_set_header X-Forwarded-Host $host;
        }

        location /ml/ {
            proxy_pass http://ml_inference_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /logos/ {
            limit_except GET HEAD {
                deny all;
            }
            rewrite ^/logos/(.*) /tenant-logos/$1 break;
            proxy_pass http://minio_backend;
            proxy_set_header Host $host;
            # GUVENLIK: Logolar uygulamanin kendi alan adindan sunuluyor. Betik
            # iceren bir dosya (onceden SVG kabul ediliyordu) burada calisamasin:
            # sandbox CSP + nosniff; eski .svg dosyalari yalnizca indirilir.
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            location ~* \.svg$ {
                limit_except GET HEAD {
                    deny all;
                }
                rewrite ^/logos/(.*) /tenant-logos/$1 break;
                proxy_pass http://minio_backend;
                proxy_set_header Host $host;
                add_header Content-Security-Policy "default-src 'none'; sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Disposition "attachment" always;
            }
        }

        location /api/organization/ {
            rewrite ^/api/organization/(.*) /api/$1 break;
            proxy_pass http://organization_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/employee/ {
            rewrite ^/api/employee/(.*) /api/$1 break;
            proxy_pass http://employee_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/workflow/ {
            rewrite ^/api/workflow/(.*) /api/$1 break;
            proxy_pass http://workflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/recruitment/ {
            rewrite ^/api/recruitment/(.*) /api/$1 break;
            proxy_pass http://recruitment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/onboarding/ {
            rewrite ^/api/onboarding/(.*) /api/$1 break;
            proxy_pass http://onboarding_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/learning/ {
            rewrite ^/api/learning/(.*) /api/$1 break;
            proxy_pass http://learning_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/notification/ {
            rewrite ^/api/notification/(.*) /api/$1 break;
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/leave/ {
            rewrite ^/api/leave/(.*) /api/$1 break;
            proxy_pass http://leave_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/compensation/ {
            rewrite ^/api/compensation/(.*) /api/$1 break;
            proxy_pass http://compensation_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/expense/ {
            rewrite ^/api/expense/(.*) /api/$1 break;
            proxy_pass http://expense_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/timeshift/ {
            rewrite ^/api/timeshift/(.*) /api/$1 break;
            proxy_pass http://timeshift_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/performance/ {
            rewrite ^/api/performance/(.*) /api/$1 break;
            proxy_pass http://performance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/tenant/ {
            rewrite ^/api/tenant/(.*) /api/$1 break;
            proxy_pass http://tenant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Keycloak yonetim konsolu icin ayri giris noktasi ("port" modu). Firewall yol
    # bazinda kural yazamadigi icin panel ayri bir portta yayinlanir; o port
    # firewall (ufw/firewalld/guvenlik grubu) ile yalnizca yonetim IP'lerine acilir.
    # Konteyner portu 8090; disariya yayinlanan adres/port .env'deki
    # KEYCLOAK_ADMIN_BIND / KEYCLOAK_ADMIN_PORT ile (varsayilan yalnizca 127.0.0.1).
    server {
        listen 8090;
        server_name _;
        server_tokens off;
        include /etc/nginx/keycloak-admin/port-*.conf;

        location = / {
            return 302 /auth/admin/;
        }

        location /auth/ {
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location / {
            return 404;
        }
    }
}
