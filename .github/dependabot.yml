# Guvenlik dalgasi 1: bagimlilik guncellemeleri. Haftalik, ekosistem basina tek toplu PR
# (kucuk ve yama surumleri birlikte); buyuk surumler ayri PR olarak gelir, CI'dan gecmeden
# birlestirilmez. Guvenlik guncellemeleri (Dependabot security updates) beklemeden acilir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "Bagimlilik (web)" }

  - package-ecosystem: nuget
    directories: ["/apps/services/*", "/tests/dotnet/*"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "Bagimlilik (.NET)" }

  - package-ecosystem: pip
    directory: /apps/ml-inference
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    open-pull-requests-limit: 3
    groups:
      ml-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "Bagimlilik (ML)" }

  - package-ecosystem: docker
    directories: ["/apps/services/*", "/apps/web", "/apps/ml-inference"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Istanbul }
    open-pull-requests-limit: 3
    groups:
      base-images: { patterns: ["*"] }
    commit-message: { prefix: "Taban imaj" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "CI eylemleri" }
