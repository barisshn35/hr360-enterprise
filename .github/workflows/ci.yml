# HR360 surekli entegrasyon: her push / PR'da arayuz, .NET servisleri,
# ML servisi ve dagitim dosyalari dogrulanir. main'e push'ta ek olarak Docker
# imajlari derlenir (yayinlanmaz).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Arayuz (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tip denetimi
        run: npm run lint
      - name: Birim testleri (Vitest)
        run: npm test
      - name: Uretim derlemesi
        env:
          VITE_KEYCLOAK_URL: /auth
          VITE_KEYCLOAK_REALM: hr360
          VITE_KEYCLOAK_CLIENT_ID: hr360-web
          VITE_API_BASE: ""
        run: npx vite build
      - name: Paket boyutu
        run: |
          echo "### Arayuz paketleri" >> "$GITHUB_STEP_SUMMARY"
          ls -S -l dist/assets/*.js | head -8 | awk '{printf "- %s — %.0f KB\n", $9, $5/1024}' >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: .NET — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - compensation-service
          - employee-service
          - engagement-service
          - expense-service
          - governance-service
          - learning-service
          - leave-service
          - notification-service
          - onboarding-service
          - organization-service
          - performance-service
          - recruitment-service
          - tenant-service
          - timeshift-service
          - workflow-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.service }}-${{ hashFiles(format('apps/services/{0}/*.csproj', matrix.service)) }}
          restore-keys: nuget-
      - name: Derle
        working-directory: apps/services/${{ matrix.service }}
        run: dotnet build -c Release -nologo

  dotnet-tests:
    name: .NET birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-tests-${{ hashFiles('tests/dotnet/**/*.csproj', 'apps/services/governance-service/*.csproj', 'apps/services/engagement-service/*.csproj') }}
          restore-keys: nuget-
      - name: xUnit
        run: |
          for p in tests/dotnet/*/; do dotnet test "$p" --nologo --logger "trx;LogFileName=results.trx"; done

  ml:
    name: ML servisi (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml-inference/requirements*.txt
      - name: Bagimliliklar
        # Testler yalnizca ai_tools router'ini yukler; mlflow/shap gibi agir
        # paketler gerekmez. Surumler requirements dosyalarindan alinir.
        run: |
          grep -E '^(fastapi|pydantic|httpx|numpy|scikit-learn)==' requirements.txt > ci-req.txt
          cat requirements-ai.txt requirements-dev.txt >> ci-req.txt
          pip install -r ci-req.txt
      - name: Sozdizimi
        run: python -m compileall -q .
      - name: Testler
        run: python -m pytest -q tests

  deploy-config:
    name: Dagitim dosyalari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ornek .env
        # .env.example'dan; orada olmayan degiskenler (sir/parola) sahte degerle eklenir.
        run: |
          cp .env.example .env
          for v in $(grep -oE '\$\{[A-Z0-9_]+' docker-compose.yml | cut -c3- | sort -u); do
            grep -q "^$v=" .env || echo "$v=ci" >> .env
          done
      - name: docker compose config (tum profiller)
        run: docker compose --profile monitoring --profile letsencrypt config -q
      - name: nginx -t
        run: docker run --rm --network none -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Prometheus kurallari
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" prom/prometheus:v2.55.1 check rules /m/alerts.yml
          # prometheus.yml rule_files yolunu konteyner icinden cozer
          docker run --rm --entrypoint sh -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v2.55.1 -c 'promtool check config /etc/prometheus/prometheus.yml'
      - name: Alertmanager yapilandirmasi (tum kanallar acik)
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e ALERT_EMAIL_TO=a@example.com,b@example.com -e ALERT_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T/B/X \
            -e ALERT_TEAMS_WEBHOOK_URL=https://example.logic.azure.com/workflows/x -e SMTP_HOST=smtp.office365.com -e SMTP_PORT=587 \
            -e SMTP_USER=u -e "SMTP_PASSWORD=p'q" \
            -v "$PWD/deploy/monitoring/alertmanager-entrypoint.sh:/e.sh:ro" -v "$PWD/deploy/monitoring/alertmanager.tmpl:/etc/alertmanager/templates/hr360.tmpl:ro" \
            prom/alertmanager:v0.28.1 /e.sh check
      - name: Grafana panosu JSON
        run: python3 -m json.tool deploy/monitoring/grafana/dashboards/hr360-overview.json > /dev/null
      - name: Kabuk betikleri (bash -n + shellcheck)
        run: |
          for f in install.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck -S error install.sh scripts/*.sh
      - name: SQL semasi (bos Postgres'e uygulanir)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=hr360admin -e POSTGRES_DB=hr360_operational postgres:18-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U hr360admin && break; sleep 2; done
          docker exec -i pg psql -U hr360admin -d hr360_operational -v ON_ERROR_STOP=1 -q < data/migrations/sql-all-schemas.sql
          docker exec pg psql -U hr360admin -d hr360_operational -Atc "select count(*) from information_schema.tables where table_schema='public'"

  images:
    name: Docker imajlari
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, dotnet, dotnet-tests, ml, deploy-config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: apps/web }
          - { name: ml-inference, context: apps/ml-inference }
          - { name: employee-service, context: apps/services/employee-service }
          - { name: engagement-service, context: apps/services/engagement-service }
          - { name: governance-service, context: apps/services/governance-service }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
