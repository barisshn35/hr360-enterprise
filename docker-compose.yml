name: hr360

# ---------------------------------------------------------------------------
# HR360 Enterprise — tek sunucuda (all-in-one) çalışan demo/portföy sürümü.
#
# Orijinal mimari 7 ayrı sanal sunucuya (uygulama x2, DB primary+standby, veri
# servisleri, ops, ML) dağıtılmış durumdaydı (bkz. docs/architecture). Bu
# dosya aynı servislerin tamamını tek makinede, servis adı üzerinden birbirini
# bulacak şekilde çalıştırır. Kurulum için kökteki install.sh scriptini
# kullanın — .env dosyasını elle oluşturmanıza gerek yok.
# ---------------------------------------------------------------------------

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_started

networks:
  default:
    name: hr360-net

volumes:
  postgres-data:
  minio-data:
  kafka-data:

services:
  # --------------------------------------------------------------------- #
  # Veri katmanı
  # --------------------------------------------------------------------- #
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr360admin
      POSTGRES_PASSWORD: ${HR360_DB_PASSWORD}
      POSTGRES_DB: hr360_operational
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - ./data/migrations/sql-all-schemas.sql:/docker-entrypoint-initdb.d/02-sql-all-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr360admin -d hr360_operational"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/tenant-logos &&
      mc mb --ignore-existing local/hr360-mlflow-artifacts &&
      mc anonymous set download local/tenant-logos
      "

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: hr360kafkacluster01
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: "768m"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # --------------------------------------------------------------------- #
  # Kimlik
  # --------------------------------------------------------------------- #
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth", "--features=organization"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    mem_limit: "768m"
    ports:
      - "127.0.0.1:8080:8080"

  # --------------------------------------------------------------------- #
  # .NET mikroservisleri — hepsi ayni Postgres DB'sini (hr360_operational),
  # ayni Keycloak realm'ini ve (varsa) ayni Kafka broker'ini paylasir.
  # --------------------------------------------------------------------- #
  organization-service:
    <<: *dotnet-service
    build: ./apps/services/organization-service
    environment:
      ORG_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  employee-service:
    <<: *dotnet-service
    build: ./apps/services/employee-service
    environment:
      EMPLOYEE_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ORGANIZATION_SERVICE_URL: "http://organization-service:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  workflow-service:
    <<: *dotnet-service
    build: ./apps/services/workflow-service
    environment:
      WORKFLOW_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  leave-service:
    <<: *dotnet-service
    build: ./apps/services/leave-service
    environment:
      LEAVE_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      ORGANIZATION_SERVICE_URL: "http://organization-service:8080"
      WORKFLOW_SERVICE_URL: "http://workflow-service:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  recruitment-service:
    <<: *dotnet-service
    build: ./apps/services/recruitment-service
    environment:
      RECRUITMENT_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  onboarding-service:
    <<: *dotnet-service
    build: ./apps/services/onboarding-service
    environment:
      ONBOARDING_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  timeshift-service:
    <<: *dotnet-service
    build: ./apps/services/timeshift-service
    environment:
      TIMESHIFT_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ORGANIZATION_SERVICE_URL: "http://organization-service:8080"
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  performance-service:
    <<: *dotnet-service
    build: ./apps/services/performance-service
    environment:
      PERFORMANCE_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ORGANIZATION_SERVICE_URL: "http://organization-service:8080"
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      ML_INFERENCE_URL: "http://ml-inference:8000"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  learning-service:
    <<: *dotnet-service
    build: ./apps/services/learning-service
    environment:
      LEARNING_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  compensation-service:
    <<: *dotnet-service
    build: ./apps/services/compensation-service
    environment:
      COMPENSATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  expense-service:
    <<: *dotnet-service
    build: ./apps/services/expense-service
    environment:
      EXPENSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      ORGANIZATION_SERVICE_URL: "http://organization-service:8080"
      WORKFLOW_SERVICE_URL: "http://workflow-service:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    mem_limit: "512m"

  notification-service:
    <<: *dotnet-service
    build: ./apps/services/notification-service
    environment:
      NOTIFICATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ASPNETCORE_ENVIRONMENT: "Production"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    mem_limit: "512m"

  tenant-service:
    <<: *dotnet-service
    build: ./apps/services/tenant-service
    environment:
      TENANT_DB_CONNECTION: "Host=postgres;Port=5432;Database=hr360_operational;Username=hr360admin;Password=${HR360_DB_PASSWORD}"
      KEYCLOAK_AUTHORITY: "http://keycloak:8080/auth/realms/hr360"
      KEYCLOAK_BASE_URL: "http://keycloak:8080/auth"
      KEYCLOAK_REALM: "hr360"
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TENANT_SECRET_KEY: ${TENANT_SECRET_KEY}
      EMPLOYEE_SERVICE_URL: "http://employee-service:8080"
      MINIO_ENDPOINT_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LOGO_PUBLIC_BASE_URL: "${PUBLIC_URL}/logos"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: "256m"

  # --------------------------------------------------------------------- #
  # ML alt sistemi
  # --------------------------------------------------------------------- #
  mlflow:
    build: ./apps/ml-platform
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql://hr360admin:${HR360_DB_PASSWORD}@postgres:5432/hr360_mlflow
      --default-artifact-root s3://hr360-mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: "1024m"
    ports:
      - "127.0.0.1:5000:5000"

  ml-inference:
    build: ./apps/ml-inference
    restart: unless-stopped
    environment:
      KEYCLOAK_URL: "http://keycloak:8080/auth"
      KEYCLOAK_REALM: "hr360"
      KEYCLOAK_CLIENT_ID: "hr360-ml-inference"
      KEYCLOAK_CLIENT_SECRET: ${ML_KEYCLOAK_CLIENT_SECRET}
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MODEL_NAME: "hr360-attrition-risk"
      MODEL_STAGE: "1"
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - mlflow
      - keycloak
    mem_limit: "768m"

  # --------------------------------------------------------------------- #
  # Web + Gateway
  # --------------------------------------------------------------------- #
  web:
    build: ./apps/web
    restart: unless-stopped
    mem_limit: "128m"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - keycloak
      - organization-service
      - employee-service
    mem_limit: "128m"
    ports:
      - "${GATEWAY_PORT:-80}:80"
