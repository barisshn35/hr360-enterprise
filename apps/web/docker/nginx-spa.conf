# HR360 frontend — statik SPA sunucusu.
# API gateway (app-01/02:80) bu container'a /  altında proxy yapar.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container health check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # İçerik hash'li varlıklar sonsuza kadar önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html asla önbelleklenmez — yeni deploy anında görünür
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # PWA: servis çalışanı her zaman taze alınmalı (yeni sürüm hemen devreye girsin).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routing fallback (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
